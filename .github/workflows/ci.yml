name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SPRING_PROFILES_ACTIVE: ci
  IMAGE_NAME: ghcr.io/nayence/lab-mcp-ai-agent

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew --no-daemon clean test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew --no-daemon clean bootJar

      - name: Build Docker image
        run: docker build -t ai-agent:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ai-agent:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker tag ai-agent:${{ github.sha }} ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  kubernetes:
    runs-on: ubuntu-latest
    needs: docker-publish
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew --no-daemon clean bootJar

      - name: Start Minikube
        uses: medyagh/setup-minikube@master

      - name: Build image in Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t ai-agent:ci .

      - name: Deploy to Minikube
        run: |
          kubectl create ns lab-agent --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f src/main/k8s/ai-agent-deployment.yml

      - name: Wait for deployment
        run: kubectl -n lab-agent rollout status deployment/ai-agent --timeout=120s

      - name: Test health endpoint
        run: |
          kubectl -n lab-agent port-forward svc/ai-agent 8080:8080 &
          sleep 10
          curl -f http://localhost:8080/actuator/health
